[project]
name = "qmf"
version = "0.1.0"
description = "Multi-factor equity trading system — institutional architecture, laptop scale"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "polars>=1.0",
    "deltalake>=0.20",
    "pyarrow>=16.0",
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
qmf = "qmf.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "hypothesis>=6.103", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmf"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
